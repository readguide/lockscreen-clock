<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clock">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:,">
  <title>Clock</title>
  <style>
    /* Original SIL OFL typeface: only a fallback, never redistributed Apple fonts. */
    @font-face { font-family: "Clock Condensed"; src: url("assets/BarlowCondensed-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
    :root { color-scheme: dark; background: #000; color: #eee; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #000; }
    main { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
    time {
      display: flex; flex: none; white-space: nowrap; gap: .045em;
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 100px; font-weight: 600; font-synthesis: none;
      font-variant-numeric: normal; font-feature-settings: normal;
      line-height: 1; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; cursor: pointer;
    }
    .digit, .colon { position: relative; display: block; overflow: hidden; height: var(--ink-height); }
    .glyph { position: absolute; left: 0; top: var(--glyph-top); display: block; }
    /* Keep the measured colon advance; center smaller dots on the visible digit ink. */
    .colon .glyph { visibility: hidden; }
    .colon::before, .colon::after {
      content: ''; position: absolute; left: 50%; width: .105em; height: .105em;
      border-radius: 50%; background: currentColor; transform: translate(-50%, -50%);
    }
    .colon::before { top: 32%; }
    .colon::after { top: 68%; }
    .styles { position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 16px); gap: 4px; padding: 4px; border: 1px solid #ffffff20; border-radius: 24px; background: #ffffff08; }
    .styles button { appearance: none; border: 0; border-radius: 20px; background: transparent; color: #c7c7c7; font: 13px -apple-system, sans-serif; min-height: 44px; padding: 0 12px; cursor: pointer; white-space: nowrap; }
    .styles button[aria-pressed="true"] { background: #ffffff16; color: #eee; }
    :focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
    :fullscreen .styles, .is-fullscreen .styles { display: none; }
    @media (display-mode: standalone) { .styles { display: none; } }
    #glass-scene { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
    [data-renderer="webgl"] #glass-scene { display: block; }
    [data-renderer="webgl"] time { color: transparent; }
    [data-renderer="webgl"] .glyph { color: transparent; }
    [data-renderer="webgl"] .colon::before, [data-renderer="webgl"] .colon::after { background: transparent; }
    [data-style="classic"] main { background: #000; }
    html:not([data-renderer="webgl"]):not([data-style="classic"]) time { color: #eee; text-shadow: 0 1px 1px #fff8; }
    @media (max-height: 430px) { .styles { bottom: 8px; } .styles button { min-height: 44px; } }
    @media (prefers-reduced-motion: reduce) { .glyph { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <!-- Uniform black is intentional: no fabricated scene to exaggerate refraction. -->
    <canvas id="glass-scene" aria-hidden="true"></canvas>
    <time id="clock" tabindex="0" title="Toggle fullscreen" aria-label="Current local time"></time></main>
  <nav class="styles" aria-label="Clock appearance">
    <button type="button" data-mode="classic" aria-pressed="true">经典白</button>
    <button type="button" data-mode="glass" aria-pressed="false">通透白</button>
    <button type="button" data-mode="frost" aria-pressed="false">柔雾白</button>
    <button type="button" data-mode="prism" aria-pressed="false">细亮边</button>
    <button type="button" data-format="hm" aria-pressed="true">时分</button>
    <button type="button" data-format="hms" aria-pressed="false">时分秒</button>
  </nav>
  <script type="module">
    import {createDigitGlass} from "./digit-glass.js";
    (() => {
      const clock = document.getElementById('clock');
      const styleButtons = document.querySelectorAll('[data-mode]');
      function setStyle(mode) {
        const selected = ['classic','glass','frost','prism'].includes(mode) ? mode : 'classic';
        document.documentElement.dataset.style = selected;
        styleButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === selected)));
        try { localStorage.setItem('clock-style', selected); } catch (_) { /* Private/file contexts may deny storage. */ }
      }
      let savedStyle;
      try { savedStyle = localStorage.getItem('clock-style'); } catch (_) {}
      setStyle(savedStyle);
      styleButtons.forEach(button => button.addEventListener('click', event => { event.stopPropagation(); setStyle(button.dataset.mode); }));
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      let timeFormat;
      try { timeFormat = localStorage.getItem('clock-format'); } catch (_) {}
      timeFormat = timeFormat === 'hms' ? 'hms' : 'hm';
      const cells = [];
      function buildCells() {
        // Mutate the shared array so the renderer sees the new layout without
        // compiling another program or retaining detached cells.
        cells.length = 0;
        clock.replaceChildren();
        for (const char of timeFormat === 'hms' ? '00:00:00' : '00:00') {
          const cell = document.createElement('span');
          cell.className = char === ':' ? 'colon' : 'digit';
          cell.setAttribute('aria-hidden', 'true');
          clock.append(cell);
          cells.push(cell);
        }
      }
      buildCells();
      const scene = document.getElementById('glass-scene');
      let renderer;
      try { renderer = createDigitGlass(scene, clock, cells); }
      catch (error) { document.documentElement.dataset.renderer = 'css'; window.glassQA = {fallback: true, reason: error.message, draws: 0}; }
      scene.addEventListener('webglcontextlost', event => { event.preventDefault(); renderer = null; document.documentElement.dataset.renderer = 'css'; });
      let glassFrame;
      function drawGlass() {
        cancelAnimationFrame(glassFrame);
        document.documentElement.dataset.renderer = renderer && document.documentElement.dataset.style !== 'classic' ? 'webgl' : 'css';
        if (!renderer) return;
        try { renderer.update(); } catch (error) { renderer = null; document.documentElement.dataset.renderer = 'css'; window.glassQA.reason = error.message; }
      }
      new MutationObserver(drawGlass).observe(clock, {childList: true, subtree: true});
      new MutationObserver(drawGlass).observe(document.documentElement, {attributes: true, attributeFilter: ['data-style']});
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      let timer, previous = '', lastUpdate = 0;
      function fit() {
        clock.style.fontSize = '100px';
        const style = getComputedStyle(clock);
        context.font = `${style.fontWeight} 100px ${style.fontFamily}`;
        const metrics = context.measureText('88:88');
        const digitWidth = Math.max(...Array.from('0123456789', n => { const m=context.measureText(n); return m.actualBoundingBoxLeft+m.actualBoundingBoxRight; }));
        const colonWidth = 10.5; // Match the actual dot width, not the font colon advance.
        const gap = 4.5; // Same .045em air between every ink-centered cell.
        const ascent = metrics.actualBoundingBoxAscent;
        const descent = metrics.actualBoundingBoxDescent;
        const digits = timeFormat === 'hms' ? 6 : 4, colons = timeFormat === 'hms' ? 2 : 1;
        const totalWidth = digitWidth * digits + colonWidth * colons + gap * (cells.length - 1);
        const size = Math.min(innerWidth * .92 / totalWidth, (innerHeight < 430 ? innerHeight - 140 : innerHeight * .8) / (ascent + descent)) * 100;
        const scale = size / 100;
        clock.style.fontSize = `${size}px`;
        clock.style.width = `${totalWidth * scale}px`;
        clock.style.justifyContent = 'center';
        // Crop the line box to actual ink, so the visible numbers are centered too.
        const top = ((metrics.fontBoundingBoxAscent + metrics.fontBoundingBoxDescent - 100) / 2 - metrics.fontBoundingBoxAscent + ascent) * scale;
        clock.style.setProperty('--ink-height', `${(ascent + descent) * scale}px`);
        clock.style.setProperty('--glyph-top', `${top}px`);
        cells.forEach((cell, index) => {
          cell.style.width = `${(cell.classList.contains('colon') ? colonWidth : digitWidth) * scale}px`;
        });
        alignGlyphs();
        drawGlass();
      }
      function alignGlyphs() {
        const style=getComputedStyle(clock);
        context.font=`${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
        cells.forEach((cell,index)=>{
          if(cell.classList.contains('colon'))return;
          for(const glyph of cell.children){const m=context.measureText(glyph.textContent);
            // Fixed tabular cells; center ink without ever moving a cell or its neighbours.
            glyph.style.left=`${(parseFloat(cell.style.width)-m.actualBoundingBoxLeft-m.actualBoundingBoxRight)/2+m.actualBoundingBoxLeft}px`;
          }
        });
      }
      function render(text, animate) {
        clock.dataset.motion=String(animate);
        const domAnimate=animate && document.documentElement.dataset.renderer!=='webgl';
        cells.forEach((cell, index) => {
          if (previous[index] === text[index]) {
            if (!animate) cell.getAnimations({ subtree: true }).forEach(a => a.finish());
            return;
          }
          cell.getAnimations({ subtree: true }).forEach(a => a.cancel());
          const old = cell.lastElementChild;
          const next = document.createElement('span');
          next.className = 'glyph'; next.textContent = text[index];
          cell.replaceChildren(...(domAnimate && old ? [old, next] : [next]));
          if (domAnimate && old && !cell.classList.contains('colon')) {
            const options = { duration: 160, easing: 'cubic-bezier(.333, 0, .667, 1)', fill: 'both' };
            // Browser-rendered, in-place transition; not a replica of Apple's native animation.
            const outgoing = old.animate([{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(2px)' }], options);
            const incoming = next.animate([{ opacity: 0, filter: 'blur(2px)' }, { opacity: 1, filter: 'blur(0)' }], {...options, duration: 220, delay: 130});
            incoming.onfinish = () => { old.remove(); outgoing.cancel(); incoming.cancel(); };
          }
        });
        alignGlyphs();
        previous = text;
        clock.dateTime = text;
        clock.setAttribute('aria-label', text);
      }
      function sync(allowMotion = false) {
        clearTimeout(timer);
        const now = new Date();
        const text = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}` + (timeFormat === 'hms' ? `:${String(now.getSeconds()).padStart(2, '0')}` : '');
        const animate = allowMotion && previous !== '' && !document.hidden && !reduced.matches && Date.now() - lastUpdate < 65000;
        render(text, animate);
        lastUpdate = Date.now();
        const interval = timeFormat === 'hms' ? 1000 : 60000;
        if (!document.hidden) timer = setTimeout(() => sync(true), interval - (Date.now() % interval));
      }
      async function fullscreen() {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
          else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
        } catch (_) { /* A browser may deny fullscreen; the clock remains usable. */ }
      }
      clock.addEventListener('click', event => { if (event.detail < 2) fullscreen(); });
      clock.addEventListener('dblclick', () => { if (!document.fullscreenElement) fullscreen(); });
      document.addEventListener('keydown', event => {
        if (event.key.toLowerCase() === 'f' && !event.repeat && !event.metaKey && !event.ctrlKey && !event.altKey) { event.preventDefault(); fullscreen(); }
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) { sync(); fit(); } else { clearTimeout(timer); cells.forEach(c => c.getAnimations({subtree:true}).forEach(a=>a.finish())); }
      });
      window.addEventListener('pageshow', () => { sync(); fit(); });
      window.addEventListener('focus', () => sync());
      window.addEventListener('resize', fit);
      function fullscreenState() { document.documentElement.classList.toggle('is-fullscreen', !!(document.fullscreenElement || document.webkitFullscreenElement)); fit(); }
      document.addEventListener('fullscreenchange', fullscreenState);
      document.addEventListener('webkitfullscreenchange', fullscreenState);
      clock.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); fullscreen(); }
      });
      document.fonts.ready.then(fit);
      const formatButtons = document.querySelectorAll('[data-format]');
      function markFormat() { formatButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.format===timeFormat))); }
      markFormat();
      formatButtons.forEach(b=>b.addEventListener('click',()=>{
        if (timeFormat===b.dataset.format) return;
        cells.forEach(c=>c.getAnimations({subtree:true}).forEach(a=>a.cancel()));
        timeFormat=b.dataset.format;
        try { localStorage.setItem('clock-format',timeFormat); } catch (_) {}
        previous=''; buildCells(); markFormat(); sync(); fit();
      }));
      window.clockQA = {render: text => render(text, true), fit};
      sync();
      fit();
    })();
  </script>
</body>
</html>
