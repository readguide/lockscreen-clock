<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clock">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:,">
  <title>Clock</title>
  <style>
    /* Original SIL OFL typeface: only a fallback, never redistributed Apple fonts. */
    @font-face { font-family: "Clock Condensed"; src: url("assets/BarlowCondensed-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
    :root { color-scheme: dark; background: #08090b; color: #eeeef0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100svh; background: #08090b; }
    main {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: max(env(safe-area-inset-top, 0px), 14svh);
      background: #08090b;
    }
    time {
      display: block;
      flex: none;
      white-space: nowrap;
      /* ui-rounded selects Apple's native rounded system face on Apple platforms. */
      font-family: ui-rounded, "SF Pro Rounded", "Clock Condensed", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 40vw;
      font-weight: 700;
      font-synthesis: none;
      font-stretch: condensed;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      font-optical-sizing: auto;
      letter-spacing: -0.055em;
      line-height: 1;
      text-align: center;
      transform: scaleX(.86);
      transform-origin: center top;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    @media (orientation: landscape) { main { padding-top: max(env(safe-area-inset-top, 0px), 10svh); } }
  </style>
</head>
<body>
  <main><time id="clock" aria-label="Current local time"></time></main>
  <script>
    (() => {
      const clock = document.getElementById('clock');
      let timer;
      function fit() {
        // Measure the widest tabular time, not the current (potentially narrow) digits.
        const current = clock.textContent;
        clock.textContent = '88:88';
        clock.style.fontSize = '100px';
        const range = document.createRange();
        range.selectNodeContents(clock);
        const unitWidth = range.getBoundingClientRect().width / 100;
        const width = Math.min(innerWidth * .92, 1400);
        clock.style.fontSize = `${Math.min(width / unitWidth, innerHeight * .72)}px`;
        clock.textContent = current;
      }
      function sync() {
        clearTimeout(timer);
        const now = new Date();
        const text = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        clock.textContent = text;
        clock.dateTime = text;
        clock.setAttribute('aria-label', text);
        timer = setTimeout(sync, 60000 - (Date.now() % 60000));
      }
      async function fullscreen() {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
          else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
        } catch (_) { /* A browser may deny fullscreen; the clock remains usable. */ }
      }
      clock.addEventListener('click', event => { if (event.detail < 2) fullscreen(); });
      clock.addEventListener('dblclick', () => { if (!document.fullscreenElement) fullscreen(); });
      document.addEventListener('keydown', event => {
        if (event.key.toLowerCase() === 'f' && !event.repeat && !event.metaKey && !event.ctrlKey && !event.altKey) { event.preventDefault(); fullscreen(); }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') { sync(); fit(); }
      });
      window.addEventListener('pageshow', () => { sync(); fit(); });
      window.addEventListener('focus', sync);
      window.addEventListener('resize', fit);
      document.addEventListener('fullscreenchange', fit);
      document.addEventListener('webkitfullscreenchange', fit);
      document.fonts.ready.then(fit);
      sync();
      fit();
    })();
  </script>
</body>
</html>
