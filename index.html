<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>Clock</title>
  <style>
    :root { color-scheme: dark; background: #08090b; color: #eeeef0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100svh; background: #08090b; }
    main {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: calc(env(safe-area-inset-top, 0px) + clamp(76px, 15svh, 160px)) 16px 24px;
    }
    time {
      display: block;
      white-space: nowrap;
      font-family: "SF Pro Rounded", ui-rounded, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: clamp(64px, 25vw, 240px);
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      font-optical-sizing: auto;
      letter-spacing: -0.065em;
      line-height: 1;
      text-align: center;
    }
    @media (min-width: 768px) {
      main { padding-top: clamp(100px, 22svh, 240px); }
      time { font-size: clamp(160px, 22vw, 280px); }
    }
    @media (max-height: 400px) {
      main { padding-top: max(24px, env(safe-area-inset-top, 0px)); }
      time { font-size: min(25vw, 55svh); }
    }
  </style>
</head>
<body>
  <main><time id="clock" aria-label="Current local time"></time></main>
  <script>
    (() => {
      const clock = document.getElementById('clock');
      let timer;
      function sync() {
        clearTimeout(timer);
        const now = new Date();
        const text = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        clock.textContent = text;
        clock.dateTime = text;
        clock.setAttribute('aria-label', text);
        timer = setTimeout(sync, 60000 - (Date.now() % 60000));
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') sync();
      });
      window.addEventListener('pageshow', sync);
      window.addEventListener('focus', sync);
      sync();
    })();
  </script>
</body>
</html>
